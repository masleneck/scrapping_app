services:
  dev:
    build: .
    container_name: scrapping-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgresql+asyncpg://scrapping:scrapping@postgres:5432/scrapping_app
    command: sleep infinity

  app:
    build: .
    container_name: scrapping-app
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      SOURCE_URL: http://mock-source:8080/flights.html
      SOURCE_URLS: http://mock-source:8080/flights.html
      DATABASE_URL: postgresql+asyncpg://scrapping:scrapping@postgres:5432/scrapping_app
    command: bash -lc "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-source:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: scrapping-postgres
    environment:
      POSTGRES_DB: scrapping_app
      POSTGRES_USER: scrapping
      POSTGRES_PASSWORD: scrapping
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapping -d scrapping_app"]
      interval: 5s
      timeout: 3s
      retries: 12

  mock-source:
    image: nginx:1.27-alpine
    container_name: scrapping-mock-source
    ports:
      - "8080:8080"
    volumes:
      - ./data/flights.html:/usr/share/nginx/html/flights.html:ro
    command: ["/bin/sh", "-c", "sed -i 's/listen       80;/listen 8080;/g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]

volumes:
  postgres_data:
