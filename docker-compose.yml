services:
  dev:
    build: .
    container_name: scrapping-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sleep infinity

  app:
    build: .
    container_name: scrapping-app
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      SOURCE_URL: http://mock-source:8080/flights.html
      SOURCE_URLS: http://mock-source:8080/flights.html
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - mock-source

  mock-source:
    image: nginx:1.27-alpine
    container_name: scrapping-mock-source
    ports:
      - "8080:8080"
    volumes:
      - ./data/flights.html:/usr/share/nginx/html/flights.html:ro
    command: ["/bin/sh", "-c", "sed -i 's/listen       80;/listen 8080;/g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
